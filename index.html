<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffc244">
    <meta name="description" content="Centrum Wiedzy Kuriera Glovo — poradniki, Live News, Asystent czasu, Newsletter i Panel Admina z bazą Firebase.">
    <title>Centrum Wiedzy Kuriera | Glovo LED Cloud Portal</title>

    <style>
        :root {
            --yellow: #ffc244;
            --green: #00e699;
            --green-glow: #00a878;
            --red-neon: #ff4d4d;
            --purple-neon: #b366ff;
            --blue-neon: #33ccff;
            --dark-bg: #0b0e0c;
            --card-bg: rgba(20, 26, 22, 0.88);
            --card-border: rgba(0, 230, 153, 0.22);
            --text-light: #f5f6f3;
            --text-muted: #9ba19a;
            --yellow-glow: rgba(255, 194, 68, 0.4);
            --radius-xl: 22px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text-light);
            background-color: var(--dark-bg);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 140px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 194, 68, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 230, 153, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(51, 204, 255, 0.04) 0%, transparent 60%);
            background-attachment: fixed;
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit;
        }

        /* --- LED HEADER --- */
        .hero {
            background: linear-gradient(135deg, rgba(255, 194, 68, 0.14) 0%, rgba(0, 230, 153, 0.07) 100%), #121814;
            border-bottom: 2px solid var(--green);
            box-shadow: 0 4px 25px rgba(0, 230, 153, 0.25);
            padding: 24px 20px 28px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 160px;
            height: 160px;
            background: var(--yellow);
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
        }

        .hero-inner {
            max-width: 950px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: rgba(255, 194, 68, 0.12);
            border: 1px solid var(--yellow);
            border-radius: 20px;
            color: var(--yellow);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            box-shadow: 0 0 12px var(--yellow-glow);
            text-transform: uppercase;
        }

        .led-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
            animation: pulse-led 1.5s infinite;
        }

        @keyframes pulse-led {
            0% { opacity: 0.4; box-shadow: 0 0 2px var(--green); }
            50% { opacity: 1; box-shadow: 0 0 12px var(--green); }
            100% { opacity: 0.4; box-shadow: 0 0 2px var(--green); }
        }

        .hero h1 {
            font-size: clamp(22px, 3.8vw, 34px);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .glovo-logo-header {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 18px var(--yellow-glow));
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .glovo-logo-header:hover {
            transform: scale(1.08) rotate(4deg);
        }

        main {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px 16px 0;
        }

        /* --- VIEWS CONTROLLER --- */
        .view-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BACK BUTTON --- */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(0, 230, 153, 0.12);
            border: 1px solid var(--green);
            border-radius: var(--radius-md);
            color: var(--green);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(0, 230, 153, 0.2);
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background: var(--green);
            color: var(--dark-bg);
            box-shadow: 0 0 20px var(--green);
        }

        /* --- FIREBASE CONFIG WIDGET (DLA UŻYTKOWNIKA) --- */
        .firebase-setup-box {
            background: rgba(255, 194, 68, 0.05);
            border: 1px dashed rgba(255, 194, 68, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        /* --- LIVE TICKER BANNER --- */
        .ticker-wrap {
            background: rgba(255, 194, 68, 0.08);
            border: 1px solid rgba(255, 194, 68, 0.3);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(255, 194, 68, 0.1);
            cursor: pointer;
        }

        .ticker-badge {
            background: var(--yellow);
            color: var(--dark-bg);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .ticker-text {
            font-size: 12px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- SEARCH BAR --- */
        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(18, 24, 20, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }

        .search-input:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 18px var(--yellow-glow), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.7;
        }

        /* --- HEADINGS & LED CARDS --- */
        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 30px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 18px;
            text-align: left;
            cursor: pointer;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            opacity: 0.5;
            transition: opacity 0.25s;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--yellow);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 20px var(--yellow-glow);
            background: rgba(30, 40, 33, 0.9);
        }

        .category-card .icon {
            font-size: 30px;
            margin-bottom: 8px;
            display: block;
        }

        .category-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .category-card p {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.35;
        }

        /* --- CHECKLIST STYLING --- */
        .checklist-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .checklist-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .check-item.checked {
            border-color: var(--green);
            background: rgba(0, 230, 153, 0.12);
        }

        .check-item.checked .check-box {
            background: var(--green);
            border-color: var(--green);
            color: var(--dark-bg);
        }

        .check-box {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* --- DETAIL & ARTICLES CARDS --- */
        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
        }

        .detail-card h2 {
            font-size: 22px;
            color: var(--yellow);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-card p {
            color: #d0d5ce;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .news-item {
            border-left: 3px solid var(--green);
            background: rgba(0, 0, 0, 0.3);
            padding: 14px 16px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 14px;
            position: relative;
        }

        .news-date {
            font-size: 11px;
            color: var(--yellow);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .empty-notice {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- ASYSTENT CZASU --- */
        .timer-display {
            font-size: 42px;
            font-weight: 800;
            color: var(--green);
            text-align: center;
            margin: 20px 0;
            text-shadow: 0 0 15px var(--green);
            font-family: monospace;
        }

        .timer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 10px;
            border: 0;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-start { background: var(--green); color: var(--dark-bg); }
        .btn-stop { background: var(--red-neon); color: #fff; }
        .btn-reset { background: rgba(255,255,255,0.1); color: #fff; }

        /* --- ADMIN PANEL STYLES --- */
        .admin-form-group {
            margin-bottom: 14px;
        }

        .admin-form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .admin-form-group input, .admin-form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .admin-form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-admin {
            background: var(--yellow);
            color: var(--dark-bg);
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 15px var(--yellow-glow);
        }

        /* --- BOTTOM TILE NAVIGATION WITH COLLAPSE --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 14, 12, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            z-index: 100;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
        }

        .bottom-nav.collapsed {
            transform: translateY(calc(100% - 32px));
        }

        .collapse-toggle-bar {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 230, 153, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-size: 14px;
            color: var(--green);
            font-weight: bold;
        }

        .nav-inner {
            max-width: 750px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        }

        .nav-tile {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .nav-tile span {
            font-size: 16px;
        }

        .nav-tile p {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1;
        }

        .nav-tile:hover, .nav-tile.active {
            background: rgba(0, 230, 153, 0.15);
            border-color: var(--green);
            box-shadow: 0 0 10px var(--green-glow);
        }

        .nav-tile.active p, .nav-tile:hover p {
            color: var(--yellow);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 20px 0;
        }

        @media (max-width: 650px) {
            .nav-tile p {
                font-size: 8px;
            }
            .nav-tile span {
                font-size: 14px;
            }
        }
    </style>

    <!-- FIREBASE SDK v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ==========================================
        // ⚙️ TUTAJ WKLEJ SWOJĄ KONFIGURACJĘ Z FIREBASE CONSOLE
        // ==========================================
        const firebaseConfig = {
            apiKey: "TUTAJ_WKLEJ_API_KEY",
            authDomain: "twoja-aplikacja.firebaseapp.com",
            projectId: "twoja-aplikacja",
            storageBucket: "twoja-aplikacja.appspot.com",
            messagingSenderId: "NUMER",
            appId: "ID_APLIKACJI"
        };

        // Inicjalizacja Firebase (jeśli konfiguracja została podana)
        let db = null;
        let auth = null;
        try {
            if (firebaseConfig.apiKey !== "TUTAJ_WKLEJ_API_KEY") {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                window.isFirebaseConfigured = true;
            } else {
                window.isFirebaseConfigured = false;
            }
        } catch (e) {
            console.error("Błąd inicjalizacji Firebase:", e);
            window.isFirebaseConfigured = false;
        }

        window.db = db;
        window.auth = auth;
        window.firebaseTools = { collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    </script>
</head>

<body>

    <!-- HERO HEADER -->
    <header class="hero">
        <div class="hero-inner">
            <div>
                <div class="brand-badge">
                    <div class="led-dot"></div> CENTRUM WIEDZY KURIERA GLOVO
                </div>
                <h1>Witaj w świecie Glovo LED!</h1>
                <p>Oficjalne poradniki, Live News, Asystent i Panel Administratora w chmurze.</p>
            </div>

            <!-- Glovo Vector Logo -->
            <svg class="glovo-logo-header" onclick="navigateTo('home')" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="#00A878"/>
                <circle cx="50" cy="50" r="42" fill="#FFC244"/>
                <path d="M50 20C36.2 20 25 31.2 25 45C25 62 50 80 50 80C50 80 75 62 75 45C75 31.2 63.8 20 50 20ZM50 55C44.5 55 40 50.5 40 45C40 39.5 44.5 35 50 35C55.5 35 60 39.5 60 45C60 50.5 55.5 55 50 55Z" fill="#0b0e0c"/>
            </svg>
        </div>
    </header>

    <main>

        <!-- FIREBASE WARNING / SETUP BANNER -->
        <div id="firebase-warning" class="firebase-setup-box" style="display: none;">
            ⚠️ <strong>Konfiguracja Firebase:</strong> Aby włączyć synchronizację w czasie rzeczywistym dla wszystkich kurierów, wklej swoje dane konfiguracyjne Firebase w sekcji `<script type="module">` powyżej. Obecnie aplikacja działa w trybie lokalnym.
        </div>

        <!-- LIVE TICKER BANNER -->
        <div class="ticker-wrap" onclick="navigateTo('news')">
            <span class="ticker-badge">LIVE NEWS</span>
            <div class="ticker-text" id="live-ticker-text">Obecnie brak ważnych komunikatów.</div>
        </div>

        <!-- WIDOK 1: STRONA GŁÓWNA -->
        <section id="view-home" class="view-panel active">
            
            <!-- SEARCH BAR -->
            <div class="search-box">
                <span class="search-icon">🔎</span>
                <input 
                    type="search" 
                    id="main-search" 
                    class="search-input" 
                    placeholder="Wyszukaj moduł, poradnik lub problem..."
                    oninput="filterCategoriesOnHome()"
                >
            </div>

            <!-- CHECKLISTA PRZED TRASĄ -->
            <div class="checklist-card">
                <h3 class="section-title">⚡ Check-lista sprzętowa przed wyjazdem</h3>
                <p style="font-size: 13px; color: var(--text-muted);">Zaznacz gotowość przed zalogowaniem do aplikacji:</p>

                <div class="checklist-items">
                    <div class="check-item" onclick="toggleCheck(this)">
                        <div class="check-box">✓</div>
                        <span style="font-size: 13px;">📱 Telefon > 80% naładowania</span>
                    </div>
                    <div class="check-item" onclick="toggleCheck(this)">
                        <div class="check-box">✓</div>
                        <span style="font-size: 13px;">🔋 Powerbank z kablem</span>
                    </div>
                    <div class="check-item" onclick="toggleCheck(this)">
                        <div class="check-box">✓</div>
                        <span style="font-size: 13px;">🎒 Czysta torba izotermiczna</span>
                    </div>
                    <div class="check-item" onclick="toggleCheck(this)">
                        <div class="check-box">✓</div>
                        <span style="font-size: 13px;">🛵 Pojazd gotowy do trasy</span>
                    </div>
                </div>
            </div>

            <h2 class="section-title">💡 Wybierz moduł wiedzy</h2>

            <div class="categories-grid" id="categories-grid-container">
                <div class="category-card" onclick="openCategoryView('start')">
                    <span class="icon">🚀</span>
                    <h3>Pierwsze kroki</h3>
                    <p>Wymagane dokumenty, rejestracja i start pierwszej dostawy.</p>
                </div>

                <div class="category-card" onclick="openCategoryView('payouts')">
                    <span class="icon">💰</span>
                    <h3>Rozliczenia i wypłaty</h3>
                    <p>Zasady płatności, przelewy, stawki i mnożniki cenowe.</p>
                </div>

                <div class="category-card" onclick="openCategoryView('sessions')">
                    <span class="icon">📅</span>
                    <h3>Sesje i Off Slot</h3>
                    <p>Grafik godzinowy, dostępność i praca bez rezerwacji.</p>
                </div>

                <div class="category-card" onclick="openCategoryView('orders')">
                    <span class="icon">🛵</span>
                    <h3>Realizacja zamówień</h3>
                    <p>Odbiór towaru, kontakt z klientem i wydanie przesyłki.</p>
                </div>

                <div class="category-card" onclick="openCategoryView('tech')">
                    <span class="icon">⚙️</span>
                    <h3>Problemy techniczne</h3>
                    <p>Aplikacja Courier, usterki GPS i brak powiadomień.</p>
                </div>

                <div class="category-card" onclick="navigateTo('errors')">
                    <span class="icon">⚠️</span>
                    <h3>FAQ – Błędy</h3>
                    <p>Sprawdź czego unikać, aby nie obniżać oceny.</p>
                </div>

                <div class="category-card" onclick="navigateTo('newsletter')">
                    <span class="icon">📬</span>
                    <h3>Newsletter</h3>
                    <p>Oficjalne ogłoszenia i komunikaty redakcyjne.</p>
                </div>

                <div class="category-card" onclick="navigateTo('assistant')">
                    <span class="icon">⏱️</span>
                    <h3>Asystent Czasu</h3>
                    <p>Licznik oczekiwania w punkcie partnerskim.</p>
                </div>
            </div>
        </section>


        <!-- WIDOK 2: SZCZEGÓŁY KATEGORII -->
        <section id="view-details" class="view-panel">
            <button class="back-button" onclick="navigateTo('home')">
                ← Powrót do ekranu głównego
            </button>
            <div id="detail-content-area"></div>
        </section>


        <!-- WIDOK 3: LIVE NEWS -->
        <section id="view-news" class="view-panel">
            <button class="back-button" onclick="navigateTo('home')">
                ← Powrót do ekranu głównego
            </button>

            <div class="detail-card">
                <h2>📢 Live News & Alerty</h2>
                <p>Na bieżąco aktualizowane komunikaty i ostrzeżenia dla kurierów z chmury.</p>
                <div id="news-container"></div>
            </div>
        </section>


        <!-- WIDOK 4: NEWSLETTER -->
        <section id="view-newsletter" class="view-panel">
            <button class="back-button" onclick="navigateTo('home')">
                ← Powrót do ekranu głównego
            </button>

            <div class="detail-card">
                <h2>📬 Tablica Newslettera</h2>
                <p>Ogłoszenia, artykuły i biuletyny informacyjne dodawane przez administratora.</p>
                <div id="newsletter-container"></div>
            </div>
        </section>


        <!-- WIDOK 5: ASYSTENT CZASU (LICZNIK) -->
        <section id="view-assistant" class="view-panel">
            <button class="back-button" onclick="navigateTo('home')">
                ← Powrót do ekranu głównego
            </button>

            <div class="detail-card">
                <h2>⏱️ Asystent Czasu w Lokalu</h2>
                <p>Uruchom stoper od momentu wejścia do restauracji. Pamiętaj, aby po 10 minutach oczekiwania zgłosić opóźnienie w aplikacji!</p>
                
                <div class="timer-display" id="timer-display">00:00</div>
                
                <div class="timer-buttons">
                    <button class="btn-action btn-start" onclick="startTimer()">Start</button>
                    <button class="btn-action btn-stop" onclick="stopTimer()">Zatrzymaj</button>
                    <button class="btn-action btn-reset" onclick="resetTimer()">Reset</button>
                </div>
            </div>
        </section>


        <!-- WIDOK 6: FAQ BŁĘDY -->
        <section id="view-errors" class="view-panel">
            <button class="back-button" onclick="navigateTo('home')">
                ← Powrót do ekranu głównego
            </button>

            <div class="detail-card">
                <h2>⚠️ FAQ — Najczęstsze błędy kurierów</h2>
                <p>Unikaj poniższych sytuacji, aby zachować wysoką ocenę w systemie.</p>

                <div class="error-card" style="background: rgba(255,77,77,0.06); border: 1px solid rgba(255,77,77,0.3); border-radius: 12px; padding: 16px; margin-bottom: 14px;">
                    <h4 style="color: var(--red-neon); margin-bottom: 6px;">❌ 1. Brak potwierdzenia przybycia</h4>
                    <p style="font-size: 13px; color: var(--text-muted);">Zawsze klikaj "Jestem w lokalu" natychmiast po dotarciu na miejsce.</p>
                </div>
                <div class="error-card" style="background: rgba(255,77,77,0.06); border: 1px solid rgba(255,77,77,0.3); border-radius: 12px; padding: 16px;">
                    <h4 style="color: var(--red-neon); margin-bottom: 6px;">❌ 2. Odjeżdżanie bez timera braku kontaktu</h4>
                    <p style="font-size: 13px; color: var(--text-muted);">Gdy klient nie odbiera, aktywuj 10-minutowy licznik w aplikacji.</p>
                </div>
            </div>
        </section>


        <!-- WIDOK 7: PANEL ADMINA -->
        <section id="view-admin" class="view-panel">
            <button class="back-button" onclick="navigateTo('home')">
                ← Powrót do ekranu głównego
            </button>

            <div class="detail-card" id="admin-login-box">
                <h2>🔐 Panel Administratora</h2>
                <p>Zaloguj się kontem administratora, aby publikować ogłoszenia w chmurze.</p>
                <div class="admin-form-group" style="margin-top: 15px;">
                    <label>Email admina:</label>
                    <input type="email" id="admin-email" placeholder="admin@glovo.pl" value="admin@glovo.pl">
                </div>
                <div class="admin-form-group">
                    <label>Hasło:</label>
                    <input type="password" id="admin-password" placeholder="Hasło...">
                </div>
                <button class="btn-admin" onclick="adminLogin()">Zaloguj się</button>
            </div>

            <div class="detail-card" id="admin-dashboard-box" style="display: none;">
                <h2>🛠️ Panel Zarządzania Treścią (Chmura)</h2>
                <p style="color: var(--green);">Status: Zalogowany jako administrator.</p>

                <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 20px 0;">

                <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--yellow);">📢 Dodaj nowy Live News</h3>
                <div class="admin-form-group">
                    <label>Treść powiadomienia (Live News):</label>
                    <input type="text" id="new-news-text" placeholder="np. Nowy mnożnik x1.8 w strefie...">
                </div>
                <button class="btn-admin" onclick="publishNewsCloud()">Opublikuj Live News</button>

                <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 25px 0 20px 0;">

                <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--yellow);">📬 Dodaj wpis do Newslettera</h3>
                <div class="admin-form-group">
                    <label>Nagłówek ogłoszenia:</label>
                    <input type="text" id="new-nl-title" placeholder="np. Zmiany w grafiku...">
                </div>
                <div class="admin-form-group">
                    <label>Treść wiadomości:</label>
                    <textarea id="new-nl-content" placeholder="Wpisz treść biuletynu..."></textarea>
                </div>
                <button class="btn-admin" onclick="publishNewsletterCloud()">Opublikuj Newsletter</button>

                <div style="margin-top: 25px; text-align: right;">
                    <button class="back-button" style="background: rgba(255,77,77,0.12); border-color: var(--red-neon); color: var(--red-neon);" onclick="adminLogout()">Wyloguj się</button>
                </div>
            </div>
        </section>

        <footer>
            Centrum Wiedzy Kuriera Glovo · Projekt LED Cloud Portal
        </footer>
    </main>

    <!-- BOTTOM KAFELKI NAVIGATION BAR Z OPCJĄ ZWIJANIA -->
    <nav class="bottom-nav" id="bottom-nav-bar">
        <div class="collapse-toggle-bar" onclick="toggleBottomNav()">
            <span id="collapse-arrow">▼ Zwiń menu</span>
        </div>
        <div class="nav-inner">
            <div class="nav-tile active" id="tile-home" onclick="navigateTo('home')">
                <span>🏠</span><p>Główna</p>
            </div>
            <div class="nav-tile" id="tile-news" onclick="navigateTo('news')">
                <span>📢</span><p>News</p>
            </div>
            <div class="nav-tile" id="tile-newsletter" onclick="navigateTo('newsletter')">
                <span>📬</span><p>Biuletyn</p>
            </div>
            <div class="nav-tile" id="tile-assistant" onclick="navigateTo('assistant')">
                <span>⏱️</span><p>Asystent</p>
            </div>
            <div class="nav-tile" id="tile-errors" onclick="navigateTo('errors')">
                <span>⚠️</span><p>Błędy</p>
            </div>
            <div class="nav-tile" id="tile-work" onclick="openCategoryView('orders')">
                <span>🛵</span><p>Praca</p>
            </div>
            <div class="nav-tile" id="tile-admin" onclick="navigateTo('admin')">
                <span>🔐</span><p>Admin</p>
            </div>
        </div>
    </nav>

    <!-- GŁÓWNY SKRYPT APLIKACJI -->
    <script>
        "use strict";

        // BAZA KATEGORII WIEDZY
        const categoryData = {
            start: {
                title: "🚀 Pierwsze kroki w Glovo",
                description: "Kompleksowy przewodnik dla nowych kurierów rozpoczynających pracę.",
                steps: [
                    "Przygotuj ważny dowód osobisty/paszport oraz zaświadczenie o niekaralności.",
                    "Podpisz umowę z wybranym partnerem rozliczeniowym lub zarejestruj własną firmę.",
                    "Odbierz zatwierdzoną torbę izotermiczną z punktu wydawania sprzętu.",
                    "Zaloguj się do aplikacji Courier, przejdź weryfikację twarzy i rozpocznij pierwszą sesję."
                ]
            },
            payouts: {
                title: "💰 Rozliczenia i Wypłaty",
                description: "Szczegółowe zasady naliczania stawek i przelewów.",
                steps: [
                    "Rozliczenia wykonywane są w cyklach tygodniowych (raport w każdy poniedziałek).",
                    "Przelewy trafiają na konto bankowe do środka lub czwartku.",
                    "Stawka składa się z kwoty bazowej, przebytych kilometrów oraz czasu oczekiwania.",
                    "Mnożniki (np. x1.5) naliczają się automatycznie podczas złych warunków pogodowych i szczytu."
                ]
            },
            sessions: {
                title: "📅 Sesje i praca Off Slot",
                description: "Zasady organizacji grafiku i dostępności.",
                steps: [
                    "Grafik otwiera się w wyznaczone dni (poniedziałki/czwartki) według oceny Excellence Score.",
                    "Rezerwacja godzin gwarantuje priorytet w przydzielaniu zamówień.",
                    "Tryb Off-Slot pozwala dołączyć do realizacji bez rezerwacji, gdy w mieście jest wysoki popyt.",
                    "Spóźnienie większe niż 15 minut na sesję powoduje automatyczne zwolnienie godziny."
                ]
            },
            orders: {
                title: "🛵 Realizacja zamówień",
                description: "Instrukcja krok po kroku od odebrania do wydania przesyłki.",
                steps: [
                    "Po zaakceptowaniu zamówienia kieruj się nawigacją do wskazanego lokalu.",
                    "W restauracji podaj numer zamówienia z aplikacji i sprawdź kompletność produktów.",
                    "Upewnij się, że napoje i ciepłe posiłki są odpowiednio zabezpieczone w torbie.",
                    "Po dotarciu do klienta wydaj przesyłkę i potwierdź kod PIN (jeśli jest wymagany)."
                ]
            },
            tech: {
                title: "⚙️ Problemy techniczne i Aplikacja",
                description: "Rozwiązania typowych błędów z aplikacją i GPS.",
                steps: [
                    "Wyłącz optymalizację baterii dla aplikacji Courier w ustawieniach telefonu.",
                    "Włącz wysoki poziom dokładności lokalizacji GPS.",
                    "W przypadku braku internetu lub zawieszenia ekranu użyj opcji 'Wymuś zatrzymanie'.",
                    "Zawsze aktualizuj aplikację do najnowszej wersji w sklepie Google Play / App Store."
                ]
            }
        };

        // LOKALNA PAMIĘĆ ZAPASOWA (JEŚLI BRAK FIREBASE)
        let liveNewsList = JSON.parse(localStorage.getItem("glovo_live_news")) || [];
        let newsletterList = JSON.parse(localStorage.getItem("glovo_newsletter")) || [];

        function initDataSync() {
            setTimeout(() => {
                if (window.isFirebaseConfigured && window.db) {
                    const { collection, onSnapshot, query, orderBy } = window.firebaseTools;
                    
                    // Nasłuch Live News w czasie rzeczywistym
                    onSnapshot(query(collection(window.db, "live_news"), orderBy("createdAt", "desc")), (snapshot) => {
                        liveNewsList = [];
                        snapshot.forEach((doc) => {
                            liveNewsList.push(doc.data());
                        });
                        renderNewsAndNewsletter();
                    }, (err) => {
                        console.log("Tryb offline / brak uprawnień Firestore, używam localStorage");
                    });

                    // Nasłuch Newsletter w czasie rzeczywistym
                    onSnapshot(query(collection(window.db, "newsletter"), orderBy("createdAt", "desc")), (snapshot) => {
                        newsletterList = [];
                        snapshot.forEach((doc) => {
                            newsletterList.push(doc.data());
                        });
                        renderNewsAndNewsletter();
                    });
                } else {
                    document.getElementById("firebase-warning").style.display = "block";
                    renderNewsAndNewsletter();
                }
            }, 1000);
        }

        function renderNewsAndNewsletter() {
            const ticker = document.getElementById("live-ticker-text");
            if (liveNewsList.length > 0) {
                ticker.textContent = `📢 ${liveNewsList[0].text || liveNewsList[0].text}`;
            } else {
                ticker.textContent = "Obecnie brak ważnych komunikatów.";
            }

            const newsContainer = document.getElementById("news-container");
            if (liveNewsList.length === 0) {
                newsContainer.innerHTML = `<div class="empty-notice">Obecnie brak Newsów.</div>`;
            } else {
                newsContainer.innerHTML = liveNewsList.map(item => `
                    <div class="news-item">
                        <div class="news-date">${item.date || 'Dzisiaj'}</div>
                        <p style="font-size: 14px; color: #fff;">${item.text}</p>
                    </div>
                `).join("");
            }

            const nlContainer = document.getElementById("newsletter-container");
            if (newsletterList.length === 0) {
                nlContainer.innerHTML = `<div class="empty-notice">Brak opublikowanych biuletynów w newsletterze.</div>`;
            } else {
                nlContainer.innerHTML = newsletterList.map(item => `
                    <div class="news-item" style="border-left-color: var(--yellow);">
                        <div class="news-date">${item.date || 'Dzisiaj'}</div>
                        <strong style="color: var(--yellow); font-size: 15px; display: block; margin-bottom: 6px;">${item.title}</strong>
                        <p style="font-size: 13px; color: #d0d5ce;">${item.content}</p>
                    </div>
                `).join("");
            }
        }

        // PANEL ADMINA - FUNKCJE PUBLIKACJI W CHMURZE
        async function adminLogin() {
            const email = document.getElementById("admin-email").value;
            const password = document.getElementById("admin-password").value;

            if (!window.isFirebaseConfigured) {
                // Tryb zapasowy lokalny
                if (email === "admin@glovo.pl" && password === "1234") {
                    showAdminDashboard();
                } else {
                    alert("Błędne dane (W trybie lokalnym: admin@glovo.pl / 1234)");
                }
                return;
            }

            try {
                const { signInWithEmailAndPassword } = window.firebaseTools;
                await signInWithEmailAndPassword(window.auth, email, password);
                showAdminDashboard();
            } catch (error) {
                alert("Błąd logowania: " + error.message);
            }
        }

        function showAdminDashboard() {
            document.getElementById("admin-login-box").style.display = "none";
            document.getElementById("admin-dashboard-box").style.display = "block";
        }

        function adminLogout() {
            if (window.isFirebaseConfigured && window.auth) {
                window.firebaseTools.signOut(window.auth);
            }
            document.getElementById("admin-dashboard-box").style.display = "none";
            document.getElementById("admin-login-box").style.display = "block";
        }

        async function publishNewsCloud() {
            const text = document.getElementById("new-news-text").value.trim();
            if (!text) return alert("Wpisz treść komunikatu!");

            const now = new Date().toLocaleString("pl-PL", { dateStyle: 'short', timeStyle: 'short' });
            
            if (window.isFirebaseConfigured && window.db) {
                try {
                    const { collection, addDoc, serverTimestamp } = window.firebaseTools;
                    await addDoc(collection(window.db, "live_news"), {
                        text: text,
                        date: now,
                        createdAt: serverTimestamp()
                    });
                    document.getElementById("new-news-text").value = "";
                    alert("Live News opublikowany w chmurze dla wszystkich!");
                    return;
                } catch (e) {
                    console.error(e);
                }
            }

            // Fallback lokalny
            liveNewsList.unshift({ text, date: now });
            localStorage.setItem("glovo_live_news", JSON.stringify(liveNewsList));
            renderNewsAndNewsletter();
            document.getElementById("new-news-text").value = "";
            alert("Live News zapisany lokalnie!");
        }

        async function publishNewsletterCloud() {
            const title = document.getElementById("new-nl-title").value.trim();
            const content = document.getElementById("new-nl-content").value.trim();
            if (!title || !content) return alert("Wypełnij wszystkie pola newslettera!");

            const now = new Date().toLocaleDateString("pl-PL");

            if (window.isFirebaseConfigured && window.db) {
                try {
                    const { collection, addDoc, serverTimestamp } = window.firebaseTools;
                    await addDoc(collection(window.db, "newsletter"), {
                        title: title,
                        content: content,
                        date: now,
                        createdAt: serverTimestamp()
                    });
                    document.getElementById("new-nl-title").value = "";
                    document.getElementById("new-nl-content").value = "";
                    alert("Newsletter opublikowany w chmurze!");
                    return;
                } catch (e) {
                    console.error(e);
                }
            }

            // Fallback lokalny
            newsletterList.unshift({ title, content, date: now });
            localStorage.setItem("glovo_newsletter", JSON.stringify(newsletterList));
            renderNewsAndNewsletter();
            document.getElementById("new-nl-title").value = "";
            document.getElementById("new-nl-content").value = "";
            alert("Newsletter zapisany lokalnie!");
        }

        // ASYSTENT CZASU (STOPER)
        let timerInterval = null;
        let secondsElapsed = 0;

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            stopTimer();
            secondsElapsed = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById("timer-display").textContent = `${mins}:${secs}`;
        }

        // ZWIJANIE DOLNEGO MENU
        let isNavCollapsed = false;
        function toggleBottomNav() {
            isNavCollapsed = !isNavCollapsed;
            const navBar = document.getElementById("bottom-nav-bar");
            const arrow = document.getElementById("collapse-arrow");
            if (isNavCollapsed) {
                navBar.classList.add("collapsed");
                arrow.textContent = "▲ Rozwiń menu";
            } else {
                navBar.classList.remove("collapsed");
                arrow.textContent = "▼ Zwiń menu";
            }
        }

        // CHECKLISTA
        function toggleCheck(element) {
            element.classList.toggle("checked");
        }

        // NAWIGACJA WIDOKÓW
        function navigateTo(viewName) {
            document.querySelectorAll(".view-panel").forEach(panel => panel.classList.remove("active"));
            document.querySelectorAll(".nav-tile").forEach(tile => tile.classList.remove("active"));

            const targetPanel = document.getElementById(`view-${viewName}`);
            const targetTile = document.getElementById(`tile-${viewName}`);

            if (targetPanel) targetPanel.classList.add("active");
            if (targetTile) targetTile.classList.add("active");

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // OTWIERANIE KATEGORIE WIEDZY
        function openCategoryView(key) {
            const data = categoryData[key];
            if (!data) return;

            const contentArea = document.getElementById("detail-content-area");

            let stepsHTML = "";
            data.steps.forEach(step => {
                stepsHTML += `<li style="position: relative; padding-left: 24px; margin-bottom: 10px;"><span style="position: absolute; left: 0; color: var(--green);">✓</span>${step}</li>`;
            });

            contentArea.innerHTML = `
                <div class="detail-card">
                    <h2>${data.title}</h2>
                    <p>${data.description}</p>
                    <h4 style="color: var(--green); margin-top: 18px; font-size: 15px;">Kluczowe zasady i instrukcje:</h4>
                    <ul style="list-style: none; margin-top: 12px; font-size: 14px;">
                        ${stepsHTML}
                    </ul>
                </div>
            `;

            document.querySelectorAll(".view-panel").forEach(panel => panel.classList.remove("active"));
            document.getElementById("view-details").classList.add("active");

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // WYSZUKIWARKA NA STRONIE GŁÓWNEJ
        function filterCategoriesOnHome() {
            const query = document.getElementById("main-search").value.toLowerCase().trim();
            const cards = document.querySelectorAll("#categories-grid-container .category-card");

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? "block" : "none";
            });
        }

        // Uruchomienie synchronizacji po załadowaniu okna
        window.addEventListener('DOMContentLoaded', initDataSync);
    </script>
</body>
</html>
